<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Mermaid Viewer & Editor</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Highlight.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-dark-theme">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-light-theme" disabled>

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/yaml.min.js"></script>
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Header Navbar -->
    <header class="navbar">
      <div class="nav-left">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span class="brand-title">Mermaid Markdown Studio</span>
        </div>

        <div class="sample-selector-wrapper">
          <label for="exampleSelect" class="sr-only">选择模板</label>
          <select id="exampleSelect" class="btn btn-secondary select-input" title="选择示例模板">
            <option value="all-in-one">📑 综合展示 (多图表与文档)</option>
            <option value="flowchart">📊 流程图 (Flowchart & Subgraphs)</option>
            <option value="sequence">🔄 时序图 (Sequence Diagram)</option>
            <option value="architecture">🏗️ 系统架构图 (Architecture & Services)</option>
            <option value="class">🧩 类图与关系 (Class Diagram)</option>
            <option value="state">⚡ 状态机图 (State Diagram)</option>
            <option value="git">🌿 Git 分支图 (Git Graph)</option>
            <option value="gantt">📅 甘特图 (Gantt Chart)</option>
            <option value="mindmap">🧠 思维导图 (Mindmap)</option>
          </select>
        </div>
      </div>

      <div class="nav-actions">
        <!-- View Mode Switcher -->
        <div class="btn-group view-modes" role="group" aria-label="视图模式">
          <button id="viewSplitBtn" class="btn btn-icon active" title="分屏模式 (Editor + Preview)" data-mode="split">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/>
            </svg>
            <span>分屏</span>
          </button>
          <button id="viewEditorBtn" class="btn btn-icon" title="仅编辑 (Editor Only)" data-mode="editor">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="8 9 12 13 8 17"/>
            </svg>
            <span>编辑</span>
          </button>
          <button id="viewPreviewBtn" class="btn btn-icon" title="仅预览 (Preview Only)" data-mode="preview">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <span>预览</span>
          </button>
        </div>

        <div class="divider-v"></div>

        <!-- Copy & Clear -->
        <button id="copyMarkdownBtn" class="btn btn-secondary" title="复制全部 Markdown">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>复制 MD</span>
        </button>

        <button id="clearEditorBtn" class="btn btn-secondary btn-icon-only" title="清空内容">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>

        <div class="divider-v"></div>

        <!-- Theme Toggle -->
        <div class="theme-toggle-wrapper">
          <button id="themeToggleBtn" class="btn btn-secondary theme-btn" title="切换深色/浅色主题">
            <span class="theme-icon dark-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </span>
            <span class="theme-icon light-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
            </span>
            <span id="themeLabel">深色模式</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace" id="workspaceContainer">
      <!-- Editor Panel -->
      <section class="pane editor-pane" id="editorPane">
        <div class="pane-header">
          <div class="pane-title">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
            </svg>
            <span>Markdown 源码</span>
          </div>
          <div class="pane-meta">
            <span id="charCount">0 字符</span>
            <span class="dot-separator">•</span>
            <span id="mermaidCount">0 个图表</span>
          </div>
        </div>
        <div class="editor-container">
          <textarea id="markdownInput" spellcheck="false" placeholder="在此输入包含 Mermaid 图表的 Markdown 内容..."></textarea>
        </div>
      </section>

      <!-- Resizer handle -->
      <div class="pane-resizer" id="paneResizer" title="拖动调整面板宽度"></div>

      <!-- Preview Panel -->
      <section class="pane preview-pane" id="previewPane">
        <div class="pane-header">
          <div class="pane-title">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <span>实时渲染预览 (图表支持滚轮缩放 / 拖拽移动 / 全屏)</span>
          </div>
          <div class="pane-actions">
            <button id="refreshRenderBtn" class="btn-tool" title="重新渲染">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
                <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
              <span>刷新</span>
            </button>
          </div>
        </div>
        <div class="preview-scroll-container">
          <article class="markdown-body" id="previewContainer">
            <!-- Rendered content inserted dynamically -->
          </article>
        </div>
      </section>
    </main>

    <!-- Fullscreen Modal for Diagrams -->
    <div id="diagramModal" class="diagram-modal" aria-hidden="true" role="dialog">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <polygon points="12 2 2 7 12 12 22 7 12 2"/>
              <polyline points="2 17 12 22 22 17"/>
              <polyline points="2 12 12 17 22 12"/>
            </svg>
            <span id="modalDiagramTitle">Mermaid 全屏互动查看</span>
          </div>
          
          <div class="modal-controls">
            <!-- Modal Zoom controls -->
            <button id="modalZoomIn" class="btn-tool" title="放大 (+)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
              </svg>
              <span>放大</span>
            </button>
            <button id="modalZoomOut" class="btn-tool" title="缩小 (-)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
              </svg>
              <span>缩小</span>
            </button>
            <button id="modalResetZoom" class="btn-tool" title="重置视角 (100%)">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
              </svg>
              <span>重置</span>
            </button>
            <button id="modalFitView" class="btn-tool" title="自适应窗口大小">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
              <span>自适应</span>
            </button>

            <div class="divider-v"></div>

            <button id="modalDownloadSvg" class="btn-tool" title="导出 SVG 矢量图">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span>导出 SVG</span>
            </button>
            <button id="modalDownloadPng" class="btn-tool" title="导出 PNG 高清图">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
              </svg>
              <span>导出 PNG</span>
            </button>

            <div class="divider-v"></div>

            <button id="modalCloseBtn" class="btn-tool btn-close" title="退出全屏 (Esc)">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
              <span>关闭</span>
            </button>
          </div>
        </div>

        <div class="modal-viewport" id="modalViewport">
          <div class="diagram-canvas panzoom-canvas" id="modalPanzoomTarget">
            <!-- Cloned SVG goes here -->
          </div>
          
          <div class="panzoom-hint">
            <span>💡 提示：按住鼠标左键拖动平移 · 滑轮缩放 · 双击重置 · 按 ESC 退出</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="examples.js"></script>
  <script src="app.js"></script>
</body>
</html>
